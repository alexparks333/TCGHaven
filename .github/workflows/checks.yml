name: Checks

# Every push to main (and every pull request): typecheck, lint, the test suites, a full
# production build and the scanner's real-scan check. Vercel's Deployment Checks wait for this job
# before a new version goes live on www.tcghaven.org, so a push that breaks any of these never
# reaches the site.
#
# Setup (done once, 2026-11-04): the six NEXT_PUBLIC_FIREBASE_* repository variables (Settings →
# Secrets and variables → Actions → Variables). They're public (every visitor's browser gets them)
# and are the only settings the build needs — no real secrets are used here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {} # a "Run workflow" button in the Actions tab

# A newer push cancels the older run still going on the same branch
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: |
          npm run test:prices
          npm run test:search
          npm run test:variants
          npm run test:pokemon-source
          npm run test:onepiece-source
          npm run test:yugioh-source
          npm run test:tcgplayer-games
          npm run test:snapshot
          npm run test:rebase
          npm run test:relief
          npm run test:scan
      # Catches what tsc can't — e.g. an invalid Next.js route export (CLAUDE.md rule 24)
      - name: Production build
        run: npm run build
      # The scanner on 64 real iPhone scans, judged as the phone would: the build above is started
      # and a version that adds a scan as the wrong card, or finds fewer right, never goes live
      # (scripts/scanner-realscans.mts, docs/card-scanner.md "The real-scan check")
      - name: Real-scan check
        run: |
          npx next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3100/ && break; sleep 1; done
          npm run test:realscans -- http://localhost:3100 || { echo '--- server log ---'; tail -40 next-start.log; exit 1; }
