name: Scanner picture index

# Fingerprints new catalog cards for the card scanner's picture search (docs/scanner-ai.md): every
# card whose photo isn't in the published index yet (a new set, a photo that arrived later) is
# downloaded, run through the trained picture AI on the CPU, and added to the index in Firebase
# Storage (catalog/scanner/). Twice a day, after the catalog syncs. Runs the same command as
# `npm run scanner-index -- update` locally.
#
# Uses the ADMIN_EMAIL / ADMIN_PASSWORD secrets and NEXT_PUBLIC_FIREBASE_* variables the other sync
# jobs use (see sync-yugioh.yml). A new model is never published from here — that's done from the
# Mac after a training run (docs/scanner-ai.md "After a training run").

on:
  schedule:
    # After the 09:00 / 21:00 UTC syncs and the 21:30 / 21:45 Yu-Gi-Oh! and TCGplayer-games jobs
    - cron: '30 10 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: scanner-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/scanner-ai/requirements-ci.txt
      - run: npm ci
      # CPU-only PyTorch (a fraction of the CUDA download)
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r tools/scanner-ai/requirements-ci.txt
      # The base model's layout comes from Hugging Face (facebook/dinov2-small, Apache-2.0); the
      # trained weights come from the manifest
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dinov2-small
      - name: Fingerprint new cards
        run: npm run scanner-index -- update --max 3000
