name: Sync Star Wars, Gundam, Flesh and Blood, Digimon and Palworld prices

# The five TCGplayer-sourced catalogs (scripts/lib/tcgplayer-games.mjs — ~32,500 English singles
# in ~280 sets, from TCGplayer through tcgcsv) once a day, as their own job like Magic and
# Yu-Gi-Oh!: ~280 per-set downloads are too long to add to the twice-daily sync-prices run.
# Runs the same command an admin runs locally (`npm run download-cards -- --only
# swu,gundam,fab,digimon,palworld`); only cards whose prices changed are written.
# Details: docs/games.md ("TCGplayer-sourced games").
#
# Setup: the same ADMIN_EMAIL / ADMIN_PASSWORD repository secrets and NEXT_PUBLIC_FIREBASE_*
# variables as sync-yugioh.yml (see the comment there).
#
# A failed run fails this job (GitHub emails the repo owner) and shows on the staff portal's Sync
# panel (sync_status/{game}).

on:
  schedule:
    # 21:45 UTC — after tcgcsv publishes (~20:05), the 21:00 sync-prices run and Yu-Gi-Oh!'s 21:30
    - cron: '45 21 * * *'
  workflow_dispatch: {} # a "Run workflow" button in the Actions tab

concurrency:
  group: sync-tcgplayer-games
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the secrets are set
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Add the ADMIN_EMAIL and ADMIN_PASSWORD repository secrets (see the comment at the top of this file)"
            exit 1
          fi
      - name: Sync the five games
        run: npm run download-cards -- --only swu,gundam,fab,digimon,palworld
