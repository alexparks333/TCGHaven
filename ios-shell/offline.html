<!doctype html>
<!-- The iPhone app's page when the live site can't be reached (capacitor.config.ts errorPath) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TCGHaven</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d9c6a0; font-family: -apple-system, system-ui, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box; text-align: center; }
    h1 { font-size: 20px; color: #2a2118; margin: 0 0 8px; }
    p { font-size: 15px; color: #5b4c3a; margin: 0 0 20px; }
    button { background: #2a2118; color: #f1d58f; font-size: 15px; font-weight: 700; border: 0; border-radius: 14px; padding: 12px 22px; }
    button:active { opacity: 0.7; }
  </style>
</head>
<body>
  <main>
    <h1>Can’t reach TCGHaven</h1>
    <p>Check your connection, then try again.</p>
    <button onclick="location.href = 'https://www.tcghaven.org'">Try again</button>
  </main>
</body>
</html>
